  et-3:
    title: Emergency Triage form + priority engine (BR-3) + save API + doctor gate (BR-4)
    status: implemented
    plan_ready: true
    depends_on: [et-1, et-2]
    spec: prd/his-global-south/emergency-triage/slices/slice-3.md
    plan: specs/features/his-global-south/emergency-triage-et-3-triage-form.md
    branch: feat/emergency-triage
    pr: null
    merged_at: null
    note: >
      Largest slice, two course corrections found during planning (both in
      technical-design.md/slice-3.md before implementing): (1) EmergencyTriageDialog
      mirrors NurseIntakeDialog's controlled-dialog pattern, not a ConsultationWorkspace
      tab (that page is doctor-only SOAP note). (2) Real BR-4 bypass found: ET-1's
      SERVICE_LINE_VISIT_TYPES fix was backend-only — the frontend has a SEPARATE
      copy in visits.service.ts that was never synced, so "Start Intake" (not "Start
      Consultation") was the actual live bug. Fixed both: synced the frontend set,
      then added the emergency+triage-not-complete guard on "Start Consultation" so
      neither button offers a path around triage.

      Also found and fixed a third SERVICE_LINE_VISIT_TYPES ripple during user
      review: getVisitStats().service_line_count now includes emergency visits;
      user chose to fix the stat card's label rather than exclude emergency from
      the count (EncountersStatsCards.tsx, "Lab, imaging, pharmacy, emergency").

      Built: migration 009 (emergency_triage_records + emergency_triage_alerts,
      no hiv_tb_answers column per the earlier resolved decision), full
      emergencyTriage/ backend module (routes/controller/service/schema/constants),
      computeTriagePriority() + computeTewsScore() as pure functions (12 unit tests,
      all BR-3 branches + boundary cases), EmergencyTriageDialog/Form (BR-1/BR-2 mode
      switching, mandatory Provisional badges on TEWS/Urgent Signs per §8.1/§8.2),
      BR-5 lock (no PATCH route, second save rejected 409).

      Verified live end-to-end: P4 happy path and P1/resuscitation path (alert row
      confirmed written) through the real createEncounter() -> saveEmergencyTriage()
      -> getEmergencyTriage() chain, BR-5 second-save rejection confirmed, encounter
      state flip confirmed (triage_status/current_step/triage_priority). Test rows
      cleaned up.

      Full regression re-verified after user asked twice to double-check: backend
      45 files / 343 tests pass (twice); frontend 977 tests, one test
      (@/modules/clinical barrel import) flaky-timeouts only under full-suite CPU
      load, confirmed clean (1.8-2.6s) in isolation 3 separate times across the
      session, including against the exact barrel file this slice modified twice.
      tsc/eslint clean on every touched file both sides.

      Post-implementation bug found and fixed while starting ET-4 planning
      (2026-08-26): listVisits()'s active_enc LATERAL join never selected the
      encounter's own id (only visit fields via v.*), so ErPendingList.tsx's row
      `id` was actually the VISIT id, not the encounter id EmergencyTriageDialog
      needs. Every real click-through would have 404'd. Never caught by direct
      service-call verification (which always used the correct encounter id
      explicitly) — only surfaced by tracing the actual UI data flow end-to-end.
      Fixed: listVisits() now also selects e.id AS encounter_id, surfaced on the
      frontend as Encounter.activeEncounterId; ErPendingList.tsx uses that instead
      of the visit id. Verified live (activeEncounterId matches the real
      createEncounter() result exactly). Targeted regression suite re-run, 108/108
      pass.

