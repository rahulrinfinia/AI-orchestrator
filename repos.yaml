# Repository manifest — projects cloned into projects/ (gitignored in hub)
#
# Modular monolith: one git repo at projects/<name>/
#   UI:   projects/<name>/src/
#   API:  projects/<name>/backend/
#
# Setup: .\scripts\setup.ps1

projects:
  - name: ipd
    repo: https://github.com/rahulrinfinia/IPD.git
    branch: main
    type: modular-monolith
    product: ipd
    layout:
      frontend: .
      backend: backend/
