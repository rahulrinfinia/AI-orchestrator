# Repository manifest
# Project key (name) drives all hub paths: docs/architecture/<name>.md, specs/features/<name>/, etc.

projects:
  - name: his-global-south
    repo: https://github.com/apeiro-care/his-global-south.git
    branch: develop
    type: modular-monolith
    product: flowmd
    layout:
      frontend: .
      backend: backend/
    features:
      - ipd
    ipd:
      backend_module: backend/src/modules/ipd/
      frontend_pages: src/pages/ipd/
      frontend_module: src/modules/ipd/
      frontend_services: src/services/ipd-*.service.ts
